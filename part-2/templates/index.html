<!DOCTYPE html>
<html>
<head>
    <title>Students List</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f5f5f5; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #4CAF50; color: white; }
        a { text-decoration: none; padding: 6px 12px; border-radius: 4px; }
        .add { background: #4CAF50; color: white; }
        .edit { background: #2196F3; color: white; }
        .delete { background: #f44336; color: white; }
        form { margin-bottom: 10px; }
        input[type=text] { padding: 6px; width: 200px; }
        button { padding: 6px 12px; }
    </style>
</head>
<body>
    <h1>Students List</h1>

    <!-- Search -->
    <form method="get" action="{{ url_for('index') }}">
        <input type="text" name="query" placeholder="Search by name" value="{{ query }}">
        <button type="submit">Search</button>
        <a href="{{ url_for('add_student') }}" class="add">Add New Student</a>
    </form>

    <table>
        <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student['id'] }}</td>
            <td>{{ student['name'] }}</td>
            <td>{{ student['email'] }}</td>
            <td>{{ student['course'] }}</td>
            <td>
                <a href="{{ url_for('edit_student', id=student['id']) }}" class="edit">Edit</a>
                <a href="{{ url_for('delete_student', id=student['id']) }}" class="delete">Delete</a>
            </td>
        </tr>
        {% endfor %}

    </table>
</body>
</html>
