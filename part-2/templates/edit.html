<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f5f5f5; }
        form { background: white; padding: 20px; border-radius: 8px; width: 400px; }
        input[type=text], input[type=email] { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #2196F3; color:white; border:none; cursor:pointer; }
        a { margin-left:10px; color:#333; }
    </style>
</head>
<body>
    <h1>Edit Student</h1>
    <form method="POST">
        <label>Name:</label>
        <input type="text" name="name" value="{{ student['name'] }}" required>
        <label>Email:</label>
        <input type="email" name="email" value="{{ student['email'] }}" required>
        <label>Course:</label>
        <input type="text" name="course" value="{{ student['course'] }}" required>
        <button type="submit">Update Student</button>
        <a href="{{ url_for('index') }}">Cancel</a>
    </form>
</body>
</html>
